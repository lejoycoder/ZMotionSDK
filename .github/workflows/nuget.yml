name: Publish NuGet

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag, for example v2.2.1'
        required: true
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Check version tag
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          $version = ([xml](Get-Content src/ZMotionSDK/ZMotionSDK.csproj)).Project.PropertyGroup.Version
          if ($env:RELEASE_TAG -ne "v$version") {
            throw "Tag $env:RELEASE_TAG does not match package version $version"
          }
      - name: Pack
        run: dotnet pack src/ZMotionSDK/ZMotionSDK.csproj -c Release -p:GeneratePackageOnBuild=false -p:ContinuousIntegrationBuild=true -o artifacts/nuget
      - uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: artifacts/nuget/*.nupkg
          if-no-files-found: error
      - name: NuGet login (OIDC)
        uses: NuGet/login@v1
        id: login
        with:
          user: lejoyke
      - name: Push to NuGet
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push "artifacts/nuget/*.nupkg" --api-key "$env:NUGET_API_KEY" --source https://api.nuget.org/v3/index.json
